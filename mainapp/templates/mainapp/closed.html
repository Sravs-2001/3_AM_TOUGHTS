<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3AM Thoughts - Closed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; background-color: #000; color: #fff; }
        .glitch { animation: glitch 2s linear infinite; }
        @keyframes glitch {
            2%, 64% { transform: translate(2px,0) skew(0deg); }
            4%, 60% { transform: translate(-2px,0) skew(0deg); }
            62% { transform: translate(0,0) skew(5deg); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden bg-black text-white">
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-neutral-900 via-black to-black -z-10"></div>
    
    <div class="text-center z-10 px-6">
        <h1 class="text-6xl md:text-8xl font-bold mb-8 tracking-widest text-neutral-800 glitch">
            3 AM
        </h1>
        <p class="text-xl md:text-2xl text-neutral-500 tracking-wide font-light">
            We are currently closed.<br><br>
            The veil only lifts between 3:00 AM and 4:00 AM.<br>
            Take your thoughts to sleep.
        </p>
    </div>
</body>
</html>
